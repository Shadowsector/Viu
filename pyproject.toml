[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "viu"
version = "0.1.0"
description = "Вью — автономный самоулучшающийся агент-соавтор для разработки 3D-игры Анабарра"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
viu = "viu.__main__:main"

[tool.setuptools.packages.find]
include = ["viu*"]

[tool.setuptools.package-data]
viu = ["prompts/*.md"]
